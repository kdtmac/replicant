<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复制人 Replicant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>复制人 Replicant</h1>
    <nav>
      <button data-view="clones" class="tab active">克隆列表</button>
      <button data-view="interview" class="tab">访谈</button>
      <button data-view="session" class="tab">即时聊天</button>
      <button data-view="upload" class="tab">上传记录</button>
      <button data-view="chat" class="tab">与复制人聊天</button>
      <button data-view="world" class="tab">模拟世界</button>
    </nav>
  </header>

  <main>
    <!-- 克隆列表 + 创建调试克隆 -->
    <section id="view-clones" class="view active">
      <h2>克隆列表</h2>
      <div class="form">
        <span>创建复制人（三选一）：</span>
        <button onclick="goView('interview')">访谈式（引导问答）</button>
        <button onclick="goView('session')">即时聊天（自由聊）</button>
        <button onclick="goView('upload')">上传聊天记录（秒建）</button>
      </div>
      <div id="clone-list" class="card-list"></div>
      <h3>快速建档（调试入口，常规路径请走上面三种方式）</h3>
      <div class="form">
        <input id="quick-name" placeholder="名字" />
        <input id="quick-traits" placeholder="特质，逗号分隔，如：开朗,幽默" />
        <input id="quick-values" placeholder="价值观，逗号分隔" />
        <button id="quick-create">创建</button>
      </div>
      <div id="clone-detail"></div>
    </section>

    <!-- 访谈 -->
    <section id="view-interview" class="view">
      <h2>访谈</h2>
      <div class="form">
        <input id="iv-name" placeholder="你的名字" />
        <button id="iv-start">开始访谈</button>
        <span id="iv-stage"></span>
      </div>
      <div id="iv-log" class="chatlog"></div>
      <div class="form">
        <input id="iv-input" placeholder="输入你的回答…" />
        <button id="iv-send">发送</button>
      </div>
    </section>

    <!-- 即时聊天模式 -->
    <section id="view-session" class="view">
      <h2>即时聊天（自由聊，不做进度条）</h2>
      <div class="form">
        <input id="cs-name" placeholder="你的名字" />
        <button id="cs-start">开始会话</button>
        <button id="cs-finalize" disabled>定型产出克隆</button>
        <span id="cs-hint"></span>
      </div>
      <div id="cs-log" class="chatlog"></div>
      <div class="form">
        <input id="cs-input" placeholder="随便聊点什么…" />
        <button id="cs-send">发送</button>
      </div>
    </section>

    <!-- 上传聊天记录 -->
    <section id="view-upload" class="view">
      <h2>上传聊天记录快速生成</h2>
      <div class="form">
        <input id="up-alias" placeholder="本人的昵称（用于从记录里挑你的消息）" />
        <input id="up-name" placeholder="克隆显示名（可留空，默认=昵称）" />
        <button id="up-submit">生成复制人</button>
      </div>
      <textarea id="up-text" rows="12" style="width:100%" placeholder="粘贴聊天导出文本。支持三种格式：
[2024-01-01 10:00] 昵称: 内容
昵称 2024-01-01 10:00 换行后写内容
昵称: 内容"></textarea>
      <pre id="up-result"></pre>
    </section>

    <!-- 与复制人聊天 -->
    <section id="view-chat" class="view">
      <h2>与复制人聊天</h2>
      <div class="form">
        <select id="chat-clone"></select>
        <span id="chat-profile-ver"></span>
      </div>
      <div id="chat-log" class="chatlog"></div>
      <div class="form">
        <input id="chat-input" placeholder="对你的复制人说点什么…" />
        <button id="chat-send">发送</button>
      </div>
    </section>

    <!-- 模拟世界 -->
    <section id="view-world" class="view">
      <h2>模拟世界</h2>
      <div class="form">
        <button id="sim-tick">Tick 一次</button>
        <span id="sim-state"></span>
      </div>
      <div id="timeline"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
